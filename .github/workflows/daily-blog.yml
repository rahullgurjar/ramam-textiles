name: Daily SEO Blog Auto-Publisher

on:
  schedule:
    # Runs automatically every single day at 09:00 AM IST (03:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows one-click manual execution anytime

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publish-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Auto-publish today's SEO blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/automate-daily-blog.js

      - name: Commit & push updated blog and sitemap
        run: |
          git config user.name "Ramam Blog Bot"
          git config user.email "bot@ramamtextiles.shop"
          git add src/data/journal.ts DAILY_BLOG_CALENDAR.md public/sitemap.xml src/data/blogQueue.json
          git commit -m "Auto-publish daily SEO blog guide [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or up-to-date"

      - name: Build production bundle
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
